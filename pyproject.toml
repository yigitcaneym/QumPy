[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qumpy"
dynamic = ["version"]            # read from qumpy/__init__.py (__version__)
description = "Beginner friendly quantum computing on top of Qiskit: one import, short commands, friendly errors."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "yigitcaneym" }]
keywords = [
    "quantum", "quantum computing", "qiskit", "education", "beginner",
    "quantum circuits", "grover", "qft", "teleportation", "trotter",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pylatexenc>=2.10",
    "sympy>=1.3",                 # needed by qiskit's array_to_latex (qp.show, qp.latex)
]

[project.urls]
Homepage = "https://github.com/yigitcaneym/QumPy"
Documentation = "https://yigitcaneym.github.io/QumPy/"
Source = "https://github.com/yigitcaneym/QumPy"
Issues = "https://github.com/yigitcaneym/QumPy/issues"

[project.optional-dependencies]
noisy = ["qiskit-ibm-runtime>=0.40"]
notebook = ["jupyter", "ipykernel"]
dev = ["pytest>=7"]
docs = ["sphinx>=8", "furo", "myst-nb>=1.1", "sphinx-copybutton"]

[tool.setuptools.dynamic]
version = { attr = "qumpy.__version__" }

[tool.setuptools.packages.find]
include = ["qumpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qumpy"
version = "0.1.0"
description = "Beginner friendly quantum computing on top of Qiskit: one import, short commands, friendly errors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.15",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pylatexenc>=2.10",
]

[project.optional-dependencies]
noisy = ["qiskit-ibm-runtime>=0.30"]
notebook = ["jupyter", "ipykernel"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["qumpy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
